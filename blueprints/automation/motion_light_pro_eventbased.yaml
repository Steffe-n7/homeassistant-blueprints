blueprint:
  name: Motion Light Pro Timer
  description: Bewegungslicht mit Dim-Timer, Aus-Timer, Restore-Szene und optionalem TV
  domain: automation

  input:
    motion_entity:
      name: Bewegungsmelder
      selector:
        entity:
          domain: binary_sensor

    light_entity:
      name: Licht
      selector:
        entity:
          domain: light

    dim_timer:
      name: Dim Timer
      selector:
        entity:
          domain: timer

    off_timer:
      name: Aus Timer
      selector:
        entity:
          domain: timer

    tv_entity:
      name: Fernseher optional
      default: ""
      selector:
        entity:
          domain: media_player

    restore_scene_id:
      name: Restore Scene ID
      default: wohnzimmer_motion_light_restore
      selector:
        text:

    dim_wait:
      name: Zeit bis Dimmen
      default: 10
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: minutes

    off_wait:
      name: Zeit bis Aus
      default: 5
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: minutes

    dim_brightness:
      name: Dimmhelligkeit
      default: 30
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"

trigger_variables:
  tv_entity: !input tv_entity

trigger:
  - platform: state
    entity_id: !input motion_entity
    to: "on"
    id: motion_on

  - platform: state
    entity_id: !input motion_entity
    to: "off"
    id: motion_off

  - platform: state
    entity_id: !input light_entity
    to: "on"
    id: light_on

  - platform: event
    event_type: timer.finished
    event_data:
      entity_id: !input dim_timer
    id: dim_timer_finished

  - platform: event
    event_type: timer.finished
    event_data:
      entity_id: !input off_timer
    id: off_timer_finished

  - platform: template
    value_template: "{{ tv_entity != '' and is_state(tv_entity, 'on') }}"
    id: tv_on

  - platform: template
    value_template: "{{ tv_entity != '' and not is_state(tv_entity, 'on') }}"
    id: tv_off

variables:
  motion_entity: !input motion_entity
  light_entity: !input light_entity
  dim_timer: !input dim_timer
  off_timer: !input off_timer
  tv_entity: !input tv_entity
  restore_scene_id: !input restore_scene_id
  restore_scene_entity: "scene.{{ restore_scene_id }}"
  dim_brightness: !input dim_brightness
  dim_wait: !input dim_wait
  off_wait: !input off_wait
  dim_duration: "{{ '%02d:%02d:00' | format((dim_wait | int // 60), (dim_wait | int % 60)) }}"
  off_duration: "{{ '%02d:%02d:00' | format((off_wait | int // 60), (off_wait | int % 60)) }}"
  tv_is_on: "{{ tv_entity != '' and is_state(tv_entity, 'on') }}"

mode: restart

action:
  - choose:
      - conditions:
          - condition: trigger
            id: motion_on
        sequence:
          - service: timer.cancel
            target:
              entity_id:
                - !input dim_timer
                - !input off_timer

          - service: scene.turn_on
            target:
              entity_id: "{{ restore_scene_entity }}"
            continue_on_error: true

          - delay:
              milliseconds: 300

          - if:
              - condition: state
                entity_id: !input light_entity
                state: "off"
            then:
              - service: light.turn_on
                target:
                  entity_id: !input light_entity

      - conditions:
          - condition: trigger
            id: motion_off
        sequence:
          - if:
              - condition: state
                entity_id: !input light_entity
                state: "on"
              - condition: template
                value_template: "{{ not tv_is_on }}"
            then:
              - service: timer.start
                target:
                  entity_id: !input dim_timer
                data:
                  duration: "{{ dim_duration }}"

      - conditions:
          - condition: trigger
            id: light_on
        sequence:
          - if:
              - condition: state
                entity_id: !input motion_entity
                state: "off"
              - condition: template
                value_template: "{{ not tv_is_on }}"
            then:
              - service: timer.start
                target:
                  entity_id: !input dim_timer
                data:
                  duration: "{{ dim_duration }}"

      - conditions:
          - condition: trigger
            id: tv_on
        sequence:
          - service: timer.cancel
            target:
              entity_id:
                - !input dim_timer
                - !input off_timer

          - if:
              - condition: state
                entity_id: !input light_entity
                state: "on"
            then:
              - service: scene.turn_on
                target:
                  entity_id: "{{ restore_scene_entity }}"
                continue_on_error: true

      - conditions:
          - condition: trigger
            id: tv_off
        sequence:
          - if:
              - condition: state
                entity_id: !input light_entity
                state: "on"
              - condition: state
                entity_id: !input motion_entity
                state: "off"
            then:
              - service: timer.start
                target:
                  entity_id: !input dim_timer
                data:
                  duration: "{{ dim_duration }}"

      - conditions:
          - condition: trigger
            id: dim_timer_finished
        sequence:
          - if:
              - condition: state
                entity_id: !input motion_entity
                state: "off"
              - condition: template
                value_template: "{{ not tv_is_on }}"
            then:
              - service: scene.create
                data:
                  scene_id: "{{ restore_scene_id }}"
                  snapshot_entities:
                    - !input light_entity

              - service: light.turn_on
                target:
                  entity_id: !input light_entity
                data:
                  brightness_pct: "{{ dim_brightness | int }}"

              - service: timer.start
                target:
                  entity_id: !input off_timer
                data:
                  duration: "{{ off_duration }}"

      - conditions:
          - condition: trigger
            id: off_timer_finished
        sequence:
          - if:
              - condition: state
                entity_id: !input motion_entity
                state: "off"
              - condition: template
                value_template: "{{ not tv_is_on }}"
            then:
              - service: light.turn_off
                target:
                  entity_id: !input light_entity
