blueprint:
  name: Motion Light Pro
  description: Bewegung -> Licht an, TV pausiert Timer, danach dimmen und aus, mit Restore-Szene
  domain: automation

  input:
    motion_entity:
      name: Bewegungsmelder
      selector:
        entity:
          domain: binary_sensor
          device_class: motion

    light_entity:
      name: Licht
      selector:
        entity:
          domain: light

    tv_entity:
      name: Fernseher optional
      default: ""
      selector:
        entity:
          domain: media_player

    restore_scene_id:
      name: Restore Scene ID
      default: wohnzimmer_motion_light_restore
      selector:
        text:

    dim_wait:
      name: Zeit bis Dimmen
      default: 10
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: minutes

    off_wait:
      name: Zeit bis Aus nach Dimmen
      default: 5
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: minutes

    dim_brightness:
      name: Dimmhelligkeit
      default: 30
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"

mode: restart

trigger:
  - platform: state
    entity_id: !input motion_entity
    to: "on"
    id: motion_on

variables:
  tv_entity: !input tv_entity
  restore_scene_id: !input restore_scene_id
  restore_scene_entity: "scene.{{ restore_scene_id }}"
  dim_brightness: !input dim_brightness

action:
  # Bewegung erkannt: immer versuchen, den letzten hellen Zustand wiederherzustellen.
  - service: scene.turn_on
    target:
      entity_id: "{{ restore_scene_entity }}"
    continue_on_error: true

  - delay:
      milliseconds: 300

  - if:
      - condition: state
        entity_id: !input light_entity
        state: "off"
    then:
      - service: light.turn_on
        target:
          entity_id: !input light_entity

  # Wenn TV an ist, bleibt die Automation hier stehen.
  # Erst wenn TV aus ist, beginnt der Bewegungs-Timer.
  - if:
      - condition: template
        value_template: "{{ tv_entity != '' }}"
    then:
      - wait_template: >
          {{ not is_state(tv_entity, 'on') }}

  # Timer bis Dimmen:
  # Wenn PIR schon off ist, einfach dim_wait warten.
  # Wenn PIR noch on ist, auf off für dim_wait warten.
  - choose:
      - conditions:
          - condition: state
            entity_id: !input motion_entity
            state: "off"
        sequence:
          - delay:
              minutes: !input dim_wait
    default:
      - wait_for_trigger:
          - platform: state
            entity_id: !input motion_entity
            to: "off"
            for:
              minutes: !input dim_wait

  # Vor dem Dimmen hellen Zustand speichern
  - service: scene.create
    data:
      scene_id: "{{ restore_scene_id }}"
      snapshot_entities:
        - !input light_entity

  # Dimmen
  - service: light.turn_on
    target:
      entity_id: !input light_entity
    data:
      brightness_pct: "{{ dim_brightness | int }}"

  # Gedimmter Zustand:
  # Bei Bewegung wird durch mode: restart die Automation neu gestartet
  # und oben die Restore-Szene wiederhergestellt.
  - wait_for_trigger:
      - platform: state
        entity_id: !input motion_entity
        to: "on"
    timeout:
      minutes: !input off_wait
    continue_on_timeout: true

  - choose:
      - conditions:
          - condition: state
            entity_id: !input motion_entity
            state: "on"
        sequence:
          - service: scene.turn_on
            target:
              entity_id: "{{ restore_scene_entity }}"
    default:
      - service: light.turn_off
        target:
          entity_id: !input light_entity
