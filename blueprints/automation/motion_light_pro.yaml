blueprint:
  name: Motion Light Pro
  description: Bewegung/Button -> Licht an, TV pausiert Timer, Dimmen, Restore, Aus
  domain: automation

  input:
    motion_entity:
      name: Bewegungsmelder
      selector:
        entity:
          domain: binary_sensor
          device_class: motion

    light_entity:
      name: Licht
      selector:
        entity:
          domain: light

    tv_entity:
      name: Fernseher optional
      default: ""
      selector:
        entity:
          domain: media_player

    restore_scene_id:
      name: Restore Scene ID
      default: wohnzimmer_motion_light_restore
      selector:
        text:

    dim_wait:
      name: Zeit bis Dimmen
      default: 10
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: minutes

    off_wait:
      name: Zeit bis Aus nach Dimmen
      default: 5
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: minutes

    dim_brightness:
      name: Dimmhelligkeit
      default: 30
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"

mode: restart

trigger:
  - platform: state
    entity_id: !input motion_entity
    to: "on"
    id: motion_on

  - platform: state
    entity_id: !input light_entity
    to: "on"
    id: light_on

variables:
  motion_entity: !input motion_entity
  light_entity: !input light_entity
  tv_entity: !input tv_entity
  restore_scene_id: !input restore_scene_id
  restore_scene_entity: "scene.{{ restore_scene_id }}"
  dim_brightness: !input dim_brightness
  dim_wait: !input dim_wait
  off_wait: !input off_wait

action:
  # Bei Bewegung: hellen Zustand wiederherstellen, falls Szene existiert.
  - choose:
      - conditions:
          - condition: trigger
            id: motion_on
          - condition: template
            value_template: "{{ states(restore_scene_entity) not in ['unknown', 'unavailable'] }}"
        sequence:
          - service: scene.turn_on
            target:
              entity_id: "{{ restore_scene_entity }}"

      - conditions:
          - condition: trigger
            id: motion_on
          - condition: state
            entity_id: !input light_entity
            state: "off"
        sequence:
          - service: light.turn_on
            target:
              entity_id: !input light_entity

  # Timer bis zum Dimmen.
  # Zählt nur, wenn PIR off und TV aus ist.
  # Bewegung oder TV an setzt den Timer zurück.
  - variables:
      timer_minutes: 0

  - repeat:
      while:
        - condition: template
          value_template: "{{ timer_minutes < (dim_wait | int) }}"
      sequence:
        - if:
            - condition: template
              value_template: "{{ tv_entity != '' and is_state(tv_entity, 'on') }}"
          then:
            - wait_template: >
                {{ not is_state(tv_entity, 'on') }}
            - variables:
                timer_minutes: 0

        - if:
            - condition: state
              entity_id: !input motion_entity
              state: "on"
          then:
            - wait_for_trigger:
                - platform: state
                  entity_id: !input motion_entity
                  to: "off"
            - variables:
                timer_minutes: 0

        - wait_for_trigger:
            - platform: state
              entity_id: !input motion_entity
              to: "on"
            - platform: template
              value_template: "{{ tv_entity != '' and is_state(tv_entity, 'on') }}"
          timeout:
            minutes: 1
          continue_on_timeout: true

        - choose:
            - conditions:
                - condition: template
                  value_template: "{{ wait.completed }}"
              sequence:
                - variables:
                    timer_minutes: 0
          default:
            - variables:
                timer_minutes: "{{ timer_minutes + 1 }}"

  # Hellen Zustand speichern
  - service: scene.create
    data:
      scene_id: "{{ restore_scene_id }}"
      snapshot_entities:
        - !input light_entity

  # Runterdimmen
  - service: light.turn_on
    target:
      entity_id: !input light_entity
    data:
      brightness_pct: "{{ dim_brightness | int }}"

  # Gedimmter Zustand: bei Bewegung wiederherstellen, sonst nach off_wait aus
  - wait_for_trigger:
      - platform: state
        entity_id: !input motion_entity
        to: "on"
    timeout:
      minutes: !input off_wait
    continue_on_timeout: true

  - choose:
      - conditions:
          - condition: state
            entity_id: !input motion_entity
            state: "on"
        sequence:
          - service: scene.turn_on
            target:
              entity_id: "{{ restore_scene_entity }}"
    default:
      - service: light.turn_off
        target:
          entity_id: !input light_entity
