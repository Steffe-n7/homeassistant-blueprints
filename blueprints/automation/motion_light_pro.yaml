blueprint:
  name: Motion Light Pro
  description: Bewegung/Button -> Licht an, nach Zeit dimmen, danach aus, mit Wiederherstellung
  domain: automation

  input:
    motion_entity:
      name: Bewegungsmelder
      selector:
        entity:
          domain: binary_sensor
          device_class: motion

    light_entity:
      name: Licht
      selector:
        entity:
          domain: light

    tv_entity:
      name: Fernseher optional
      default: ""
      selector:
        entity:
          domain: media_player

    dim_wait:
      name: Zeit bis Dimmen
      default: 10
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: minutes

    off_wait:
      name: Zeit bis Aus nach Dimmen
      default: 5
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: minutes

    dim_brightness:
      name: Dimmhelligkeit
      default: 30
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"

mode: restart

trigger:
  - platform: state
    entity_id: !input motion_entity
    to: "on"
    id: motion

  - platform: state
    entity_id: !input light_entity
    to: "on"
    id: light_on

variables:
  motion_entity: !input motion_entity
  light_entity: !input light_entity
  tv_entity: !input tv_entity
  dim_wait: !input dim_wait
  off_wait: !input off_wait
  dim_brightness: !input dim_brightness

action:
  - service: light.turn_on
    target:
      entity_id: !input light_entity

  - if:
      - condition: template
        value_template: "{{ tv_entity != '' }}"
    then:
      - wait_template: >
          {{ not is_state(tv_entity, 'on') }}

  - wait_for_trigger:
      - platform: state
        entity_id: !input motion_entity
        to: "off"
        for:
          minutes: !input dim_wait

  - service: scene.create
    data:
      scene_id: motion_light_pro_restore
      snapshot_entities:
        - !input light_entity

  - service: light.turn_on
    target:
      entity_id: !input light_entity
    data:
      brightness_pct: "{{ dim_brightness | int }}"

  - wait_for_trigger:
      - platform: state
        entity_id: !input motion_entity
        to: "on"
    timeout:
      minutes: !input off_wait
    continue_on_timeout: true

  - choose:
      - conditions:
          - condition: state
            entity_id: !input motion_entity
            state: "on"
        sequence:
          - service: scene.turn_on
            target:
              entity_id: scene.motion_light_pro_restore
    default:
      - service: light.turn_off
        target:
          entity_id: !input light_entity
